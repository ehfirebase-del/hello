<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Taman Notice Board</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #f7f8f6;
    color: #2d3230;
    line-height: 1.55;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 32px 20px 48px; }
  header { margin-bottom: 28px; }
  header h1 { font-size: 1.6rem; font-weight: 700; letter-spacing: -0.01em; }
  header p { color: #6b7470; font-size: 0.95rem; margin-top: 4px; }

  section { margin-bottom: 28px; }
  section h2 {
    font-size: 0.8rem; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.08em; color: #8a938f; margin-bottom: 12px;
  }

  /* Quick filter */
  .filters { display: flex; gap: 10px; flex-wrap: wrap; }
  .filters button {
    padding: 8px 18px; border: 1px solid #d5dcd8; border-radius: 999px;
    background: #ffffff; color: #4a524e; font-size: 0.92rem; cursor: pointer;
    transition: background 0.15s, color 0.15s, border-color 0.15s;
  }
  .filters button:hover { border-color: #9fb0a7; }
  .filters button.active {
    background: #3e6b57; border-color: #3e6b57; color: #ffffff;
  }

  /* Notices list */
  .notice-list { display: flex; flex-direction: column; gap: 12px; }
  .notice-card {
    background: #ffffff; border: 1px solid #e2e7e4; border-radius: 12px;
    padding: 16px 18px; cursor: pointer; text-align: left; width: 100%;
    font: inherit; color: inherit;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .notice-card:hover { border-color: #9fb0a7; box-shadow: 0 2px 8px rgba(45,50,48,0.06); }
  .notice-card.selected { border-color: #3e6b57; box-shadow: 0 2px 8px rgba(62,107,87,0.15); }
  .notice-top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .notice-title { font-weight: 600; font-size: 1.02rem; flex: 1 1 auto; }
  .badge {
    font-size: 0.72rem; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.05em; padding: 3px 10px; border-radius: 999px;
  }
  .badge.urgent { background: #fbeaea; color: #a33a3a; }
  .badge.community { background: #e7f0ec; color: #3e6b57; }
  .badge.maintenance { background: #eef1fb; color: #4a5a9e; }
  .notice-date { font-size: 0.85rem; color: #8a938f; white-space: nowrap; }
  .empty {
    background: #ffffff; border: 1px dashed #cfd6d2; border-radius: 12px;
    padding: 24px; text-align: center; color: #8a938f; font-size: 0.95rem;
  }

  /* Details */
  .details {
    background: #ffffff; border: 1px solid #e2e7e4; border-radius: 12px;
    padding: 20px 22px;
  }
  .details-placeholder { color: #8a938f; font-size: 0.95rem; padding: 8px 0; }
  .details h3 { font-size: 1.15rem; margin-bottom: 8px; }
  .details .meta { display: flex; gap: 12px; align-items: center; margin-bottom: 14px; }
  .details .date { font-size: 0.85rem; color: #8a938f; }
  .details .body { white-space: pre-wrap; font-size: 0.98rem; }
  @media (max-width: 480px) {
    .wrap { padding: 24px 16px 40px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Taman Notice Board</h1>
    <p>Latest announcements from the Residents Association</p>
  </header>

  <section aria-label="Quick filter">
    <h2>Quick Filter</h2>
    <div class="filters" id="filters">
      <button data-filter="all" class="active">All</button>
      <button data-filter="urgent">Urgent</button>
      <button data-filter="community">Community</button>
    </div>
  </section>

  <section aria-label="Latest notices">
    <h2>Latest Notices</h2>
    <div class="notice-list" id="noticeList"></div>
  </section>

  <section aria-label="Notice details">
    <h2>Notice Details</h2>
    <div class="details" id="details">
      <p class="details-placeholder">Tap a notice above to read the full message here.</p>
    </div>
  </section>
</div>

<script>
  var NOTICES = [
    {
      id: 1,
      title: "Water supply interruption on Jalan Kenari this Thursday",
      date: "2026-11-16",
      type: "urgent",
      label: "Urgent",
      body: "The water supply in Taman Melur will be interrupted on Thursday, 19 November 2026, from 9:00 am to 4:00 pm along Jalan Kenari and Jalan Cempaka for pipe replacement works by the water utility.\n\nPlease store enough water for cooking and drinking beforehand. The association apologises for the inconvenience. For updates, check the notice board near the guardhouse."
    },
    {
      id: 2,
      title: "Gotong-royong community clean-up this Sunday",
      date: "2026-11-14",
      type: "community",
      label: "Community",
      body: "Join our gotong-royong (community clean-up) this Sunday, 22 November 2026, from 8:00 am to 11:00 am. We will meet at the playground area on Jalan Melur.\n\nGloves, rubbish bags and light refreshments will be provided. Please wear comfortable clothes and bring a hat. All residents are welcome — let's keep our taman clean together."
    },
    {
      id: 3,
      title: "Annual general meeting at the community hall",
      date: "2026-11-10",
      type: "community",
      label: "Community",
      body: "The Residents Association Annual General Meeting will be held on Saturday, 5 December 2026, at 8:00 pm in the community hall on Jalan Melur.\n\nAgenda: financial report, security updates from the guard service, and the election of new committee members. All residents are encouraged to attend and vote. Light refreshments will be served."
    },
    {
      id: 4,
      title: "Lift maintenance at Block B car park",
      date: "2026-11-08",
      type: "maintenance",
      label: "Maintenance",
      body: "Routine maintenance of the car park lift at Block B will be carried out on Monday, 23 November 2026, from 10:00 am to 12:00 pm. The lift will be temporarily out of service during this time.\n\nPlease use the staircase or the Block A lift if you need access to the upper levels. Thank you for your patience."
    }
  ];

  var currentFilter = "all";
  var selectedId = null;

  var listEl = document.getElementById("noticeList");
  var detailsEl = document.getElementById("details");
  var filtersEl = document.getElementById("filters");

  function formatDate(iso) {
    var d = new Date(iso + "T00:00:00");
    var months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
    return d.getDate() + " " + months[d.getMonth()] + " " + d.getFullYear();
  }

  function sortedNotices() {
    return NOTICES.slice().sort(function(a, b) {
      return b.date.localeCompare(a.date);
    });
  }

  function visibleNotices() {
    var notices = sortedNotices();
    if (currentFilter === "all") return notices;
    return notices.filter(function(n) { return n.type === currentFilter; });
  }

  function renderList() {
    var notices = visibleNotices();
    listEl.innerHTML = "";
    if (notices.length === 0) {
      var empty = document.createElement("div");
      empty.className = "empty";
      empty.textContent = "No notices in this category right now.";
      listEl.appendChild(empty);
      return;
    }
    notices.forEach(function(n) {
      var card = document.createElement("button");
      card.className = "notice-card" + (n.id === selectedId ? " selected" : "");
      card.innerHTML =
        '<div class="notice-top">' +
          '<span class="notice-title"></span>' +
          '<span class="badge ' + n.type + '">' + n.label + '</span>' +
          '<span class="notice-date">' + formatDate(n.date) + '</span>' +
        '</div>';
      card.querySelector(".notice-title").textContent = n.title;
      card.addEventListener("click", function() { selectNotice(n.id); });
      listEl.appendChild(card);
    });
  }

  function renderDetails() {
    var n = NOTICES.filter(function(x) { return x.id === selectedId; })[0];
    if (!n) {
      detailsEl.innerHTML = '<p class="details-placeholder">Tap a notice above to read the full message here.</p>';
      return;
    }
    detailsEl.innerHTML =
      '<h3></h3>' +
      '<div class="meta">' +
        '<span class="badge ' + n.type + '">' + n.label + '</span>' +
        '<span class="date">' + formatDate(n.date) + '</span>' +
      '</div>' +
      '<div class="body"></div>';
    detailsEl.querySelector("h3").textContent = n.title;
    detailsEl.querySelector(".body").textContent = n.body;
  }

  function selectNotice(id) {
    selectedId = id;
    renderList();
    renderDetails();
  }

  filtersEl.addEventListener("click", function(e) {
    var btn = e.target.closest("button");
    if (!btn) return;
    currentFilter = btn.getAttribute("data-filter");
    filtersEl.querySelectorAll("button").forEach(function(b) {
      b.classList.toggle("active", b === btn);
    });
    renderList();
  });

  // Initial render: newest first, first notice pre-selected so details is never blank
  selectedId = sortedNotices()[0].id;
  renderList();
  renderDetails();
</script>
</body>
</html>
